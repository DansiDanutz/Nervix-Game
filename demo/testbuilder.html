<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Builder house — demo preview</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #eef3f6; color: #1f2a33; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0 0 4px; color: #2f6f6a; }
      .owner { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }
      .card { background: #fff; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 8px 28px rgba(31,42,51,.14); }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e6eef2; }
      .row:last-child { border-bottom: 0; }
      a.button { display: inline-block; margin-top: 14px; padding: 10px 16px; border-radius: 10px; background: #b5486b; color: #fff; text-decoration: none; }
      .note { font-size: 12px; opacity: .7; margin-top: 14px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #2f6f6a; color: #fff; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">demo fixture</span>
      <h1>{{NAME}}</h1>
      <div class="owner">Owner: {{OWNER}}</div>

      <div class="card">
        {{ROWS}}
        <p class="note">Different priced assets from a different owner. No purchase is possible here.</p>
        <a class="button" href="{{APP_URL}}" target="_blank" rel="noopener noreferrer">Open the local test app</a>
      </div>
      <p class="note">Builder app: the local test app served by this isolated demo server. Not shared with DanGG.</p>
    </main>
  </body>
</html>
